[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mocs-cert"
version = "0.1.0"
description = "Molecular Certificate System with Deductive Verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MOCS-Cert Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.5.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0.0",
    "MDAnalysis>=2.7.0",
    "defusedxml>=0.7.1"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0"
]
e2e = [
    "playwright>=1.40.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mocs*", "backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "backend/tests"]
addopts = "--import-mode=importlib"

